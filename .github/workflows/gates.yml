name: gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the SDK of global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run the gates
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # The commit-message gate checks the commits a pull request or a push brings, and a
          # release tag the commits since the previous release tag (the whole history for the first).
          if ($env:EVENT_NAME -eq 'pull_request') {
            $base = $env:PULL_REQUEST_BASE
            $head = $env:PULL_REQUEST_HEAD
          }
          elseif ($env:REF_TYPE -eq 'tag') {
            $head = $env:PUSH_AFTER
            $base = git describe --tags --abbrev=0 --match 'v*' "$head^" 2>$null
            if ($LASTEXITCODE -ne 0) { $base = '' }
          }
          else {
            $base = $env:PUSH_BEFORE
            $head = $env:PUSH_AFTER
          }
          ./build/gates/run-gates.ps1 -Base $base -Head $head
